<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Drive Video Embed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="w-full max-h-[500px] aspect-video rounded-lg overflow-hidden">
      <iframe
        src="https://drive.google.com/file/d/144a79YqIBjk7OZG5iBEGKUxnYSGON8jf/preview"
        class="w-full h-full rounded-lg"
        allow="autoplay"
        allowfullscreen
      ></iframe>
    </div>
  </div>

</body>
</html>
